<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="only light">
  <title>我的帳戶｜ERIC TING English Pronunciation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20260925-plan1">
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js?v=20260916-auth2"></script>
  <script src="js/auth-firebase.js?v=20260916-auth1"></script>
  <script src="js/auth-mock.js?v=20260916-auth1"></script>
  <script src="js/auth-service.js?v=20260916-auth1"></script>
  <script src="js/membership.js?v=20260925-plan1"></script>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <a class="account-icon is-auth-pending" href="login.html" aria-label="我的帳戶"></a>
  <nav class="nav">
    <a href="course.html"><img src="assets/icons/course-book.svg" alt="">課程學習</a>
    <a href="index.html"><img src="assets/icons/home.svg" alt="">自由練習</a>
    <a href="history.html"><img src="assets/icons/history.svg" alt="">歷史紀錄</a>
  </nav>
  <a class="help-link" href="help.html"><img src="assets/icons/help.svg" alt="">使用說明</a>
</aside>
<main>
<header class="header">
  <div class="title">
    <img class="site-logo" src="assets/English Pronunciation_logo.svg" alt="English Pronunciation">
  </div>
</header>
<section class="card page-card">
  <div class="section-title"><span class="num"><img src="assets/icons/profile.svg" alt=""></span>我的帳戶</div>
  <p class="hint">這是你的 Google 帳號資料。韻律自然度是否開啟由伺服器驗證，前端不會存放 VIP 名單。</p>

  <div class="profile-head">
    <div class="avatar" id="avatarInitial"></div>
    <div>
      <div class="profile-name-row">
        <strong id="profileName"></strong>
        <button class="primary-btn btn-outline name-edit-btn" id="editNameBtn">編輯名字</button>
      </div>
      <div class="profile-email" id="profileEmail"></div>
    </div>
  </div>

  <div class="form" id="editNameForm" style="display:none;margin-top:18px;max-width:360px">
    <input class="input" id="nameInput" maxlength="20" placeholder="輸入新的顯示名字">
    <div style="display:flex;gap:10px">
      <button class="primary-btn btn-compact" id="saveNameBtn">儲存</button>
      <button class="primary-btn btn-outline btn-compact" id="cancelNameBtn">取消</button>
    </div>
  </div>

  <div class="profile-rows">
    <div class="profile-row"><span>已連接帳號</span><span id="profileProvider"></span></div>
    <div class="profile-row"><span>目前方案</span><span class="plan-badge plan-badge-loading" id="profilePlan">讀取中…</span></div>
    <div class="profile-row"><span>加入時間</span><span id="profileJoined">--</span></div>
  </div>

  <div style="display:flex;justify-content:flex-end;margin-top:20px">
    <button class="primary-btn btn-danger-outline btn-compact" id="logoutBtn">登出</button>
  </div>
</section>

<section class="card page-card" style="margin-top:20px">
  <div class="section-title"><span class="num"><img src="assets/icons/folder.svg" alt=""></span>資料夾</div>
  <div class="folder-create-row">
    <input type="text" id="newFolderInput" class="input" placeholder="新增資料夾名稱" maxlength="20">
    <button type="button" id="newFolderBtn" class="primary-btn btn-compact">新增資料夾</button>
  </div>
  <div class="folder-list" id="folderList"></div>
</section>
<script src="js/config.js"></script>
<script src="js/tts.js?v=20260916-auth1"></script>
<script src="js/folders.js"></script>
<script src="js/audio-player.js"></script>
<script src="js/profile.js?v=20260925-plan1"></script>
</main>
<nav class="bottom-nav">
  <a class="bottom-nav-account active" href="login.html" id="bottomAccountLink">
    <span class="bottom-nav-icon is-auth-pending" id="bottomAccountIcon"></span>
    <span>個人</span>
  </a>
  <a href="course.html">
    <span class="bottom-nav-icon"><img src="assets/icons/course-book.svg" alt=""></span>
    <span>課程學習</span>
  </a>
  <a href="index.html">
    <span class="bottom-nav-icon"><img src="assets/icons/home.svg" alt=""></span>
    <span>自由練習</span>
  </a>
  <a href="history.html">
    <span class="bottom-nav-icon"><img src="assets/icons/history.svg" alt=""></span>
    <span>歷史紀錄</span>
  </a>
  <a href="help.html">
    <span class="bottom-nav-icon"><img src="assets/icons/help.svg" alt=""></span>
    <span>使用說明</span>
  </a>
</nav>
<script src="js/account-nav.js?v=20260924-avatar2"></script>
</div>
</body>
</html>
