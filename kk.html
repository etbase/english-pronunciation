  <script src="js/auth-mock.js?v=20260916-auth1"></script>
  <script src="js/auth-service.js?v=20260925-avatar3"></script>
  <script src="js/membership.js?v=20260925-plan1"></script>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <a class="account-icon is-auth-pending" href="login.html" aria-label="我的帳戶"></a>
  <script>(function(){var a=document.currentScript.previousElementSibling;if(window.Auth&&Auth.paintCachedAvatar)Auth.paintCachedAvatar(a);})();</script>
  <nav class="nav">
    <a href="course.html"><img src="assets/icons/course-book.svg" alt="">課程學習</a>
    <a href="index.html"><img src="assets/icons/home.svg" alt="">自由練習</a>
    <a href="history.html"><img src="assets/icons/history.svg" alt="">歷史紀錄</a>
    <!-- TEMP KK PHONETIC FEATURE: desktop nav -->
    <a href="kk.html" class="active"><img src="assets/icons/kk-phonetic.svg" alt="">KK 音標</a>
    <!-- /TEMP KK PHONETIC FEATURE -->
  </nav>
  <a class="help-link" href="help.html"><img src="assets/icons/help.svg" alt="">使用說明</a>
</aside>
<main>
<header class="header">
  <div class="title">
    <img class="site-logo" src="assets/English Pronunciation_logo.svg" alt="English Pronunciation">
  </div>
</header>
<section class="card page-card kk-page">
  <div class="kk-tabs" role="tablist">
    <button type="button" class="kk-tab active" id="kkTabPhonemes" data-kk-tab="phonemes">KK 音標</button>
    <button type="button" class="kk-tab" id="kkTabExamples" data-kk-tab="examples">單字例句</button>
  </div>

  <div id="kkPhonemePanel">
    <div class="section-title"><span class="num"><img src="assets/icons/kk-phonetic.svg" alt=""></span>KK 音標</div>
    <p class="hint">聽美式 KK 音標的標準發音。每個音檔都是同一個音連續 3 次。</p>
    <div class="kk-toolbar">
      <button type="button" class="primary-btn btn-outline btn-compact" id="kkPlayAll">全部播放</button>
      <button type="button" class="primary-btn btn-outline btn-compact" id="kkDownloadAll" hidden>全部下載</button>
    </div>
    <div class="notice kk-status" id="kkStatus" hidden></div>
    <div class="kk-columns">
      <div>
        <div class="section-title kk-group-title"><span class="num">1</span>母音 17</div>
        <div class="kk-list" id="kkVowelList"></div>
      </div>
      <div>
        <div class="section-title kk-group-title"><span class="num">2</span>子音 24</div>
        <div class="kk-list" id="kkConsonantList"></div>
      </div>
    </div>
  </div>

  <div id="kkExamplesPanel" hidden>
    <div class="section-title"><span class="num"><img src="assets/icons/kk-phonetic.svg" alt=""></span>單字例句</div>
    <p class="hint">資料來自 KK 音標互動學習網站。音檔使用 Azure Neural TTS 美式男聲 Andrew，正常語速 1.0x。開啟頁面不會自動產生音檔。</p>
    <p class="kk-ex-meta" id="kkExStats"></p>
    <div class="voice-row" id="kkExVoiceRow"></div>
    <div class="kk-ex-filters">
      <select id="kkExTypeFilter" aria-label="類型">
        <option value="all">全部</option>
        <option value="word">單字</option>
        <option value="sentence">例句</option>
      </select>
      <select id="kkExPhonemeFilter" aria-label="KK 音標分類"></select>
      <input class="input" id="kkExSearch" type="search" placeholder="搜尋英文單字或例句" maxlength="80">
    </div>
    <div class="kk-toolbar">
      <button type="button" class="primary-btn btn-outline btn-compact" id="kkExZipAll">全部下載 ZIP</button>
      <button type="button" class="primary-btn btn-outline btn-compact" id="kkExZipWords">下載全部單字 ZIP</button>
      <button type="button" class="primary-btn btn-outline btn-compact" id="kkExZipSentences">下載全部例句 ZIP</button>
      <button type="button" class="primary-btn btn-outline btn-compact" id="kkExPause" hidden>暫停</button>
      <button type="button" class="primary-btn btn-outline btn-compact" id="kkExResume" hidden>繼續</button>
    </div>
    <div class="notice kk-status kk-ex-progress" id="kkExStatus" hidden></div>
    <div class="kk-ex-progress-bar" id="kkExProgressBar" hidden><div class="kk-ex-progress-fill" id="kkExProgressFill"></div></div>
    <div id="kkExList"></div>
  </div>
</section>
<script src="js/config.js"></script>
<script src="js/tts.js?v=20261020-ex1"></script>
<script src="js/kk-data.js?v=20261002-kk1"></script>
<script src="js/kk.js?v=20261020-ex1"></script>
<script src="js/kk-examples-data.js?v=20261020-ex1"></script>
<script src="js/kk-examples.js?v=20261020-ex1"></script>
</main>

  </a>

    <span class="bottom-nav-icon"><img src="assets/icons/course-book.svg" alt=""></span>
    <span>課程學習</span>
  </a>
  <a href="index.html">
    <span class="bottom-nav-icon"><img src="assets/icons/home.svg" alt=""></span>
    <span>自由練習</span>
  </a>
  <a href="history.html">
    <span class="bottom-nav-icon"><img src="assets/icons/history.svg" alt=""></span>
    <span>歷史紀錄</span>
  </a>
  <!-- TEMP KK PHONETIC FEATURE: mobile nav (temporarily replaces 使用說明) -->
  <a href="kk.html" class="active">
    <span class="bottom-nav-icon"><img src="assets/icons/kk-phonetic.svg" alt=""></span>
    <span>KK 音標</span>
  </a>
  <!-- /TEMP KK PHONETIC FEATURE -->
</nav>
<script src="js/account-nav.js?v=20260925-avatar3"></script>
</div>
</body>
</html>
